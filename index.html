<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawthorne PTA — Give for Good Louisville</title>
<meta name="description" content="Live prize standings for Hawthorne Elementary PTA at Give for Good Louisville.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌻</text></svg>">
<style>
  :root{
    --ink:#16203a; --muted:#5f6d8c; --faint:#8b97b0; --line:#e4e9f2;
    --bg:#fff; --panel:#f7f9fc; --accent:#8431a6; --accent-soft:#f4eafa;
    --live:#0f9d58; --live-soft:#e8f6ee; --gold:#b8860b; --gold-soft:#fdf6e3;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto}

  .eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{font-size:20px;margin:3px 0 0;font-weight:750;letter-spacing:-.01em}
  .tier{display:inline-block;margin-left:8px;vertical-align:2px;background:var(--accent-soft);
    color:var(--accent);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.03em}

  .total{display:flex;align-items:baseline;gap:12px;margin-top:16px;flex-wrap:wrap}
  .amount{font-size:42px;font-weight:800;letter-spacing:-.025em;line-height:1}
  .goalnote{color:var(--muted);font-size:13px}
  .bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin:12px 0 6px}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .7s ease}
  .stats{display:flex;gap:22px;margin-top:12px;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink);font-size:17px;font-weight:750;margin-right:5px}

  .hero{margin-top:22px;border:1.5px solid var(--live);background:var(--live-soft);
    border-radius:12px;padding:16px 18px}
  .hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .hero .pname{font-size:17px;font-weight:750}
  .hero .clock{font-variant-numeric:tabular-nums;font-weight:750;color:var(--live);font-size:15px;white-space:nowrap}
  .hero .rank{font-size:31px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
  .hero .detail{color:var(--muted);font-size:13.5px;margin-top:5px}
  .hero .gap{margin-top:9px;font-size:13.5px;font-weight:650;color:var(--ink)}

  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .card{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--bg)}
  .card.final{background:var(--panel)}
  .card.podium{border-color:var(--gold);background:var(--gold-soft)}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
  .card .pn{font-weight:700;font-size:14px;line-height:1.25}
  .chip{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 7px;border-radius:99px;white-space:nowrap}
  .chip.live{background:var(--live);color:#fff}
  .chip.upcoming{background:var(--panel);color:var(--faint);border:1px solid var(--line)}
  .chip.final{background:#dfe5ef;color:#4a5670}
  .card .rk{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .card .rk small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
  .card .meta{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .card .when{font-size:11.5px;color:var(--faint);margin-top:7px}

  .actions{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
  .cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:8px;font-weight:750;font-size:15px}
  .secondary{color:var(--accent);font-weight:650;font-size:14px;text-decoration:none;
    border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent);padding-bottom:1px}
  .secondary:hover{border-bottom-color:var(--accent)}
  .foot{margin-top:14px;font-size:11.5px;color:var(--faint)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);
    margin-right:5px;vertical-align:1px}
  .dot.stale{background:#d0a215}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .stalebar{margin-top:14px;background:#fdf6e3;border:1px solid #e8d9a8;color:#7a5c00;
    border-radius:8px;padding:9px 12px;font-size:13px}
  .stalebar a{color:#7a5c00}
  .meta.pending{color:#9a7400;font-style:italic}
  .closed-head{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
  @media (max-width:520px){ .amount{font-size:34px} body{padding:14px} }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="empty">Loading…</div>
</div>

<script>
var STATE = null;

function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
function num(n){ return Math.round(n).toLocaleString('en-US'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function valueOf(p, v){
  if (v == null) return '—';
  return p.field === 'dollars_in_cents' ? money(v/100)
    : num(v) + ' ' + (p.rankBy === 'donors' ? 'donors' : 'gifts');
}
function rankByLabel(rb){
  return rb === 'donors' ? 'donor count' : rb === 'donations' ? 'gifts' : 'dollars';
}
function clockTime(iso){
  return new Date(iso).toLocaleTimeString('en-US',
    {hour:'numeric', minute:'2-digit', timeZone:'America/New_York'});
}
function dayOf(iso){
  return new Date(iso).toLocaleDateString('en-US',
    {month:'short', day:'numeric', timeZone:'America/New_York'});
}
/** A timed prize window (a couple of hours), as opposed to an all-day board. */
function isWindow(p){
  return new Date(p.end).getTime() - new Date(p.start).getTime() <= 6*3600*1000;
}
/**
 * Status is recomputed here rather than trusted from the file. The refresh job
 * stamps a status when it runs, but the file can be several minutes old by the
 * time you read it — a window that has since closed would otherwise still show
 * LIVE with 0:00 on the clock.
 */
function statusOf(p){
  var now = Date.now();
  if (now < new Date(p.start).getTime()) return 'upcoming';
  if (now > new Date(p.end).getTime()) return 'final';
  return 'live';
}
/** True when a window has closed but our numbers predate the close. */
function isPending(p, dataTs){
  return statusOf(p) === 'final' && dataTs < new Date(p.end).getTime();
}
/** "8:00 AM - 9:59 AM ET", or "Sep 7 - Sep 10" for multi-day boards. */
function spanOf(p){
  var a = new Date(p.start), b = new Date(p.end);
  var sameDay = a.toDateString() === b.toDateString();
  if (!sameDay) return dayOf(p.start) + ' – ' + dayOf(p.end);
  if (isWindow(p)) return clockTime(p.start) + ' – ' + clockTime(p.end) + ' ET';
  return 'All day';
}
function countdown(ms){
  if (ms < 0) ms = 0;
  var s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  s = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}

function render(){
  if (!STATE || !STATE.org) {
    document.getElementById('root').innerHTML =
      '<div class="empty">No readings yet — run <code>installTrigger()</code> in the script editor.</div>';
    return;
  }
  var s = STATE, o = s.org;
  var pct = o.goal ? Math.min(100, o.raised / o.goal * 100) : 0;
  var h = [];

  h.push('<div class="eyebrow">Give for Good Louisville</div>');
  h.push('<h1>' + esc(s.config.label) +
    (s.tier ? '<span class="tier">' + esc(s.tier) + '</span>' : '') + '</h1>');

  h.push('<div class="total"><div class="amount">' + money(o.raised) + '</div>' +
    (o.goal ? '<div class="goalnote">of our ' + money(o.goal) + ' goal · ' +
      Math.round(pct) + '%</div>' : '') + '</div>');
  if (o.goal) h.push('<div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div>');
  h.push('<div class="stats">' +
    '<div><b>' + num(o.donors) + '</b>donors</div>' +
    '<div><b>' + num(o.donations) + '</b>gifts</div>' +
    '<div><b>' + money(o.avgGift) + '</b>avg gift</div></div>');

  // Giving is the point of the page, so the button sits above the fold rather
  // than below a long prize grid. The official leaderboards sit beside it
  // permanently — this page always trails them by a minute or two, and during
  // the last minutes of a window that is the one to trust.
  h.push('<div class="actions">' +
    '<a class="cta" href="' + esc(s.config.url) + '"' + NEWTAB + '>Give now</a>' +
    '<a class="secondary" href="' + esc(LEADERBOARDS) + '"' + NEWTAB + '>' +
    'Official leaderboards \u2197</a></div>');

  var dataTs = new Date(s.ts).getTime();
  var ageMin = (Date.now() - dataTs) / 60000;

  // Status is recomputed here, not taken from the file — see statusOf().
  var prizes = (s.prizes || []).map(function(p){
    var c = {}; for (var k in p) c[k] = p[k];
    c.status = statusOf(p);
    c.pending = isPending(p, dataTs);
    return c;
  });

  if (ageMin > 3) {
    h.push('<div class="stalebar">These numbers are ' + Math.round(ageMin) +
      ' minutes old. <a href="' + LEADERBOARDS + '"' + NEWTAB +
      '>Official leaderboards</a></div>');
  }

  // The hero is for the timed window that's open right now. All-day boards
  // (Grand Prize, All Organizations) stay in the grid — they're always "live".
  var live = prizes.filter(function(p){ return p.status === 'live' && isWindow(p); });

  live.forEach(function(p){
    var left = new Date(p.end).getTime() - Date.now();
    h.push('<div class="hero">');
    h.push('<div class="row"><div class="pname">🟢 ' + esc(p.prize) +
      (p.tier ? ' · ' + esc(p.tier) : '') + '</div>' +
      '<div class="clock" data-end="' + p.end + '">' + countdown(left) + ' left</div></div>');
    h.push('<div class="rank">' + (p.rank ? '#' + p.rank +
      ' <span style="font-size:16px;font-weight:600;color:var(--muted)">of ' +
      num(p.total) + '</span>' : 'Not on the board yet') + '</div>');
    h.push('<div class="detail">' + valueOf(p, p.value) + ' this window · ranked by ' +
      rankByLabel(p.rankBy) + ' · closes ' + clockTime(p.end) + '</div>');
    if (p.gap != null && p.chasing) {
      h.push('<div class="gap">' + valueOf(p, p.gap) + ' behind ' + esc(p.chasing) +
        ' for #' + (p.rank - 1) + '</div>');
    } else if (p.rank === 1) {
      h.push('<div class="gap">🥇 We are leading this one.</div>');
    }
    h.push('</div>');
  });

  // Finished prizes move out of the way. What's still winnable stays at the
  // top where it can be acted on; results become a record you scroll to.
  var open = prizes.filter(function(p){ return p.status !== 'final'; });
  var closed = prizes.filter(function(p){ return p.status === 'final'; });

  // Closing soonest first: the prize you can still do something about outranks
  // one that runs until midnight. Timed windows therefore lead, and the
  // all-day boards settle to the bottom. Ties broken by start, then name, so
  // the order stays put between refreshes instead of shuffling.
  open.sort(function(a, b){
    return (new Date(a.end) - new Date(b.end)) ||
           (new Date(a.start) - new Date(b.start)) ||
           (a.prize < b.prize ? -1 : a.prize > b.prize ? 1 : 0);
  });

  // Most recently decided first — that's the one people are asking about.
  closed.sort(function(a, b){ return new Date(b.end) - new Date(a.end); });

  if (open.length) {
    h.push('<h2>Still in play' + (s.tier ? ' · ' + esc(s.tier) : '') + '</h2>');
    h.push('<div class="grid">');
    open.forEach(function(p){ h.push(card(p, s)); });
    h.push('</div>');
  }

  if (closed.length) {
    var medals = closed.filter(function(p){ return p.rank && p.rank <= 3 && !p.pending; }).length;
    h.push('<h2 class="closed-head">Closed · ' + closed.length + ' decided' +
      (medals ? ' · ' + medals + ' top-three finish' + (medals > 1 ? 'es' : '') : '') +
      '</h2>');
    h.push('<div class="grid">');
    closed.forEach(function(p){ h.push(card(p, s)); });
    h.push('</div>');
  }

  // The refresh job runs on a 5-minute schedule and GitHub can delay it, so
  // say how old the reading is rather than implying it's live to the second.
  var age = Math.round(ageMin);
  h.push('<div class="foot"><span class="dot' + (age > 4 ? ' stale' : '') + '"></span>' +
    'Updated ' + clockTime(s.ts) + ' ET' +
    (age >= 1 ? ' · ' + age + ' min ago' : ' · just now') +
    ' · <a href="' + esc(LEADERBOARDS) + '"' + NEWTAB +
    '>official leaderboards</a></div>');

  document.getElementById('root').innerHTML = h.join('');
}

/** One prize card. Shared by the "still in play" and "closed" grids. */
function card(p, s){
  var h = [];
  var podium = p.status === 'final' && !p.pending && p.rank && p.rank <= 3;
  h.push('<div class="card ' + p.status + (podium ? ' podium' : '') + '">');
  h.push('<div class="top"><div class="pn">' + esc(p.prize) + '</div>' +
    '<span class="chip ' + p.status + '">' +
    (p.status === 'final' ? 'closed' : p.status) + '</span></div>');

  if (p.status === 'upcoming') {
    h.push('<div class="rk"><small>Opens ' + clockTime(p.start) + '</small></div>');
    h.push('<div class="meta">Ranked by ' + rankByLabel(p.rankBy) + '</div>');
  } else if (p.rank) {
    var medal = podium ? ['🥇','🥈','🥉'][p.rank-1] + ' ' : '';
    h.push('<div class="rk">' + medal + '#' + p.rank +
      ' <small>of ' + num(p.total) + '</small></div>');
    h.push('<div class="meta">' + valueOf(p, p.value) + ' · by ' +
      rankByLabel(p.rankBy) + '</div>');
    if (p.pending) {
      h.push('<div class="meta pending">Provisional — taken at ' +
        clockTime(s.ts) + ', before this window closed.</div>');
    }
    if (p.status === 'live' && p.gap != null) {
      h.push('<div class="meta">' + valueOf(p, p.gap) + ' behind ' + esc(p.chasing) + '</div>');
    }
    if (p.leader) {
      h.push('<div class="meta">' + (p.status === 'final' ? 'Won by: ' : 'Leader: ') +
        esc(p.leader.name) + ' (' + valueOf(p, p.leader.value) + ')</div>');
    }
  } else {
    h.push('<div class="rk"><small>' +
      (p.status === 'final' ? 'Did not place' : (p.scored ? 'Not ranked' : 'No gifts yet')) +
      '</small></div>');
    h.push('<div class="meta">Ranked by ' + rankByLabel(p.rankBy) + '</div>');
  }
  h.push('<div class="when">' + spanOf(p) + '</div>');
  h.push('</div>');
  return h.join('');
}

/** Ticks the live countdown every second without refetching. */
function tickClocks(){
  var els = document.querySelectorAll('.clock[data-end]');
  for (var i = 0; i < els.length; i++) {
    var left = new Date(els[i].getAttribute('data-end')).getTime() - Date.now();
    els[i].textContent = countdown(left) + ' left';
    if (left <= 0) { poll(); return; }   // window just closed — get final standing
  }
}

/**
 * Where the numbers come from.
 *
 * The event API sends no CORS headers, so this page cannot call it. A GitHub
 * Action fetches it server-side and commits data.json to the `data` branch.
 * Getting that file back out, fresh, is the awkward part — two sources, each
 * broken in a different way, so the page uses both and keeps whichever
 * reading is newer:
 *
 *   raw.githubusercontent.com — no rate limit, but Fastly caches it for five
 *     minutes and a cache-busting query does not reliably defeat that. It has
 *     been observed serving a copy 27 minutes old.
 *
 *   api.github.com/contents — served within seconds of the commit, but only
 *     60 requests an hour PER IP for anonymous callers. A school network is a
 *     single IP, so a dozen parents on the same wifi would exhaust it. Polled
 *     sparingly, and a 403 just means we coast on raw until the hour resets.
 */
// ─────────────────────────────────────────────────────────────────────────
//  PASTE YOUR APPS SCRIPT /exec URL BETWEEN THE QUOTES BELOW.
//  See apps-script/Endpoint.gs. Once set, the page reads live numbers every
//  15 seconds straight from it and ignores the GitHub sources entirely —
//  no cache, no rate limit, no waiting on a commit.
// ─────────────────────────────────────────────────────────────────────────
var LIVE_ENDPOINT = '';

var LEADERBOARDS = 'https://www.giveforgoodlouisville.org/p/leaderboards';

// Every link here leaves for giveforgoodlouisville.org. They all open in a new
// tab so nobody loses the tracker — and, on a phone, so a half-finished
// donation form isn't destroyed by tapping back. rel guards the new tab from
// reaching back at this page via window.opener.
var NEWTAB = ' target="_blank" rel="noopener noreferrer"';

var RAW = 'https://raw.githubusercontent.com/israelagm/giveforgood-tracker/data/data.json';
var API = 'https://api.github.com/repos/israelagm/giveforgood-tracker/contents/data.json?ref=data';

/**
 * Keep the last reading so a reload paints immediately with something real
 * (correctly labelled with its age) instead of a blank "Loading…".
 */
function saveLast(data){
  try { localStorage.setItem('gfg:last', JSON.stringify(data)); } catch (e) {}
}
function loadLast(){
  try {
    var raw = localStorage.getItem('gfg:last');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function adopt(data){
  // Either source can hand back something older than what we already have.
  if (!data || !data.ts) return;
  if (STATE && new Date(data.ts).getTime() <= new Date(STATE.ts).getTime()) return;
  STATE = data;
  saveLast(data);
  render();
}

function showLoadError(){
  if (STATE) return;   // we have something to show; a failed poll is harmless
  document.getElementById('root').innerHTML =
    '<div class="empty">Couldn\'t load the latest numbers.<br>' +
    '<a href="' + LEADERBOARDS + '"' + NEWTAB + '>Official leaderboards</a></div>';
}

function pollRaw(){
  fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(adopt)
    .catch(function(err){ showLoadError(); console.warn('raw:', err); });
}

/**
 * The fast source allows 60 requests an hour per internet connection, shared
 * by everyone on it. A page load would otherwise spend one every time, so a
 * few people refreshing repeatedly could drain the whole school's allowance.
 * Remember across reloads when we last used it and skip if it was recent.
 */
var API_MIN_GAP = 90000;

function apiLastCall(){
  try { return Number(localStorage.getItem('gfg:apiLast') || 0); } catch (e) { return 0; }
}
function noteApiCall(){
  try { localStorage.setItem('gfg:apiLast', String(Date.now())); } catch (e) {}
}

function pollApi(){
  if (Date.now() - apiLastCall() < API_MIN_GAP) return;   // too soon; raw covers us
  noteApiCall();
  fetch(API + '&t=' + Date.now(),
        { headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store' })
    .then(function(r){
      if (r.status === 403) return null;   // rate limited; raw carries us
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(adopt)
    .catch(function(err){ console.warn('api:', err); });
}

function pollLive(){
  // Apps Script answers on script.googleusercontent.com after a redirect;
  // send no custom headers so this stays a simple request with no preflight.
  fetch(LIVE_ENDPOINT + '?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      if (d && d.error) throw new Error(d.error);
      STATE = d;            // always authoritative; it is computed on request
      render();
    })
    .catch(function(err){ showLoadError(); console.warn('live:', err); });
}

// Paint the previous reading first so a refresh is never a blank screen.
STATE = loadLast();
if (STATE) render();

if (LIVE_ENDPOINT) {
  // Real time: computed per request, so poll it directly and often.
  pollLive();
  setInterval(pollLive, 15000);
} else {
  // Fallback while no endpoint is configured: raw is unlimited but lags
  // several minutes, the API is seconds-fresh but capped at 60/hour per IP.
  pollRaw();
  pollApi();
  setInterval(pollRaw, 20000);
  setInterval(pollApi, 120000);
}
setInterval(tickClocks, 1000);
</script>
</body>
</html>
