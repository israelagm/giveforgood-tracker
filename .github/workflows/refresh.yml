name: Refresh leaderboard data

on:
  schedule:
    # Five minutes is GitHub's floor for cron, which is too coarse for a prize
    # window decided by a handful of donors. So each run loops internally,
    # refreshing about once a minute until the next run takes over.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # A new scheduled run replaces the previous looping one, so only one process
  # is ever committing. Without this the runs would overlap and race on push.
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh on a loop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 5); do
            echo "::group::pass $i"
            node scripts/refresh.mjs || echo "fetch failed, will retry next pass"

            if git diff --quiet -- data.json; then
              echo "no change"
            else
              git add data.json
              git commit -q -m "Standings $(TZ=America/New_York date '+%-I:%M %p ET')"
              # A cancelled predecessor may have landed a commit first.
              git pull --rebase --autostash -q origin main || true
              git push -q || echo "push rejected, next pass will retry"
            fi
            echo "::endgroup::"

            [ "$i" -lt 5 ] && sleep 55
          done
          exit 0
