name: Refresh leaderboard data

# One dispatch covers the whole event.
#
# A single Actions job is capped at 6 hours, and cron cannot be relied on to
# start a replacement — GitHub queues schedule events best-effort on free
# public repos and on this repo not one ever fired. So instead of hoping for a
# successor, three shifts are chained with `needs` inside ONE run. Each waits
# for the previous to finish, giving ~17 hours of unbroken coverage from a
# single click.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # belt and braces; starts a run only if none exists

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false   # a second run waits its turn, never kills the worker

jobs:
  shift-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/refresh
        with:
          minutes: '340'

  shift-2:
    needs: shift-1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/refresh
        with:
          minutes: '340'

  shift-3:
    needs: shift-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/refresh
        with:
          minutes: '340'
