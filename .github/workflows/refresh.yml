name: Refresh leaderboard data

on:
  schedule:
    # Every 5 minutes — GitHub's minimum for scheduled workflows. Runs can be
    # delayed under load, so treat the timestamp on the page as the truth
    # rather than assuming the data is 5 minutes old at most.
    - cron: '*/5 * * * *'
  workflow_dispatch:      # lets you force a refresh from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch standings
        run: node scripts/refresh.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change."
            exit 0
          fi
          git add data.json
          git commit -m "Refresh standings: $(date -u '+%Y-%m-%d %H:%MZ')"
          # Another scheduled run may have landed while this one was fetching.
          git pull --rebase --autostash origin main
          git push
